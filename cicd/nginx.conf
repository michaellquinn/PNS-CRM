# Serve the SPA: static files with a fallback to index.html for client-side routes.
# /api is routed to the backend by the Ingress, so it never reaches nginx.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints every bundle it emits (app-4f2c9b1e.js), so a changed file gets a
    # changed name. Those are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html is the ONE unhashed file, and it is what names the hashed bundles. With
    # no cache directive nginx sends only Last-Modified, so browsers apply heuristic
    # caching and keep serving yesterday's index.html — which points at yesterday's
    # bundles. The app then looks like the deploy never happened until someone hard
    # reloads. It must never be cached.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
